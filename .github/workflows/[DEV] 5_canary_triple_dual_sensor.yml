name: '[DEV] 5_canary_triple_dual_sensor [90m]'

on:
  schedule:
    # Денний розклад UTC (кожні 3 год о :05, між вікнами 1_ і 2_, без нічного запуску):
    # 07:05, 10:05, 13:05, 16:05, 19:05 UTC (= 09:05..21:05 Київ взимку / 10:05..22:05 влітку)
    - cron: '5 7,10,13,16,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-canary-5-triple
  cancel-in-progress: false

jobs:
  run-5-canary-triple-dual-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run [DEV] 5_canary_triple_dual_sensor.py
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] 5_canary_triple_dual_sensor.py"
