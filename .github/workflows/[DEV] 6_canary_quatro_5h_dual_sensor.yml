name: '[DEV] 6_canary_quatro_5h_dual_sensor [5h]'

on:
  schedule:
    # Нічний автозапуск 5-год дводатчикового сценарію (Refill_Drain_UNIT_quatro):
    # 22:20 UTC -> ~03:15 UTC (= 00:20..~05:15 Київ взимку / 01:20..~06:15 влітку)
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-canary-6-quatro-5h
  cancel-in-progress: false

jobs:
  run-6-canary-quatro-5h-dual-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run [DEV] 6_canary_quatro_5h_dual_sensor.py
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] 6_canary_quatro_5h_dual_sensor.py"
