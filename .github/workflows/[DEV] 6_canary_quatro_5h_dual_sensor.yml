name: '[DEV] 6_canary_quatro_5h_dual_sensor [5h]'

on:
  schedule:
    # 24/7 автозапуск 5-год дводатчикового сценарію Quatro (Refill_Drain_UNIT_quatro) кожні 6 год (~5 год прогін + ~1 год пауза):
    # 01:20, 07:20, 13:20, 19:20 UTC (= 03:20, 09:20, 15:20, 21:20 Київ взимку)
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-canary-6-quatro-5h
  cancel-in-progress: false

jobs:
  run-6-canary-quatro-5h-dual-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run [DEV] 6_canary_quatro_5h_dual_sensor.py
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] 6_canary_quatro_5h_dual_sensor.py"
