name: Canary Monitor (Teltonika)

on:
  schedule:
    # Запускається на 45-й хвилині кожної 3-ї години (02:45, 05:45, 08:45...)
    - cron: '45 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

jobs:
  run-canary-teltonika:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Kyiv
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Canary Script (Teltonika)
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python canary_teltonika.py
