name: '[DEV] Canary Monitor (Teltonika Single: 2 Refills + Trip + Drain)'

on:
  schedule:
    # Запускається кожні 3 години на 5-й хвилині (00:05, 03:05, 06:05... за Києвом)
    - cron: '5 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-canary-teltonika-single-2refill-drain:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Guard against 5h Deep Check collision on device 47613
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/%5BDEV%5D%20canary_teltonika_long_5h.yml/runs?per_page=5"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "canary-guard/1.0",
          })
          skip = False
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  runs = json.loads(r.read().decode()).get("workflow_runs", [])
              now = datetime.now(timezone.utc)
              for run in runs:
                  st = run.get("status")
                  if st in ("in_progress", "queued", "waiting"):
                      print(f"5h Deep Check run #{run.get('id')} is active ({st}) -> skipping.")
                      skip = True
                      break
                  upd = run.get("updated_at")
                  if upd:
                      dt = datetime.fromisoformat(upd.replace("Z", "+00:00"))
                      age_min = (now - dt).total_seconds() / 60.0
                      if age_min < 210.0:
                          print(f"5h Deep Check run #{run.get('id')} finished {age_min:.1f}m ago (<210m) -> skipping.")
                          skip = True
                          break
          except Exception as exc:
              print(f"Guard check skipped due to API error (proceeding): {exc}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          EOF

      - name: Checkout repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v3

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Canary Script ([DEV] Teltonika Single 2x Refill + Drain)
        if: steps.guard.outputs.skip != 'true'
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] canary_teltonika_single_2refill_drain.py"
