name: '[DEV] Canary Monitor (Teltonika Single Refill & Drain)'

on:
  schedule:
    # Запускається на 7-й хвилині кожної 3-ї години (02:07, 05:07, 08:07... за Києвом)
    - cron: '7 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  run-canary-teltonika-single:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Kyiv
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Canary Script ([DEV] Teltonika Single)
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] canary_teltonika_single.py"
