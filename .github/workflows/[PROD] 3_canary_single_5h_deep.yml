name: '[PROD] 3_canary_single_5h_deep [5h]'

on:
  schedule:
    # Автозапуск 3 рази на добу кожні 8 год (~5 год 11 хв прогін + ~2 год 49 хв пауза):
    # 01:15, 09:15, 17:15 UTC (= 03:15, 11:15, 19:15 Київ взимку)
    - cron: '15 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prod-canary-3-single-5h
  cancel-in-progress: false

jobs:
  run-prod-3-canary-single-5h-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run [PROD] 3_canary_single_5h_deep.py
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://my.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[PROD] 3_canary_single_5h_deep.py"
