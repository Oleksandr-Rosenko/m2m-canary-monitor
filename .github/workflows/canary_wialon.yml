name: Canary Monitor (Wialon IPS)

on:
  schedule:
    # Запускається на 35-й хвилині кожної 3-ї години
    - cron: '35 */4 * * *'
  workflow_dispatch: # Дозволяє ручний запуск

jobs:
  run-canary-wialon:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Kyiv
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Canary Script (Wialon IPS)
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python canary_wialon.py
