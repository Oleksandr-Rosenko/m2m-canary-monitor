name: '[DEV] Canary Monitor (Teltonika 5h Deep Check: MAN + 4130 + Drain)'

on:
  # Окремий ручний запуск для перевірки 3-год лівого краю фіксу WEB-2433 (не перетинається з короткими прогонами).
  # За потреби нічного автозапуску (00:30 за Києвом) можна розкоментувати schedule нижче:
  # schedule:
  #   - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-canary-teltonika-long-5h:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Wait if Short Single Canary is currently running on device 47613
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, time, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/%5BDEV%5D%20canary_teltonika_single_2refill_drain.yml/runs?per_page=3"
          deadline = time.monotonic() + 3000  # чекаємо максимум 50 хв завершення короткого запуску
          while time.monotonic() < deadline:
              try:
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "canary-guard/1.0",
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      runs = json.loads(r.read().decode()).get("workflow_runs", [])
                  active = [x for x in runs if x.get("status") in ("in_progress", "queued", "waiting")]
                  if not active:
                      print("Device 47613 is free. Starting 5h Deep Check.")
                      break
                  print(f"Waiting for Short Single run #{active[0].get('id')} ({active[0].get('status')})...")
              except Exception as exc:
                  print(f"Guard check error (proceeding): {exc}")
                  break
              time.sleep(30)
          EOF

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Canary Script ([DEV] Teltonika 5h Deep Check)
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] canary_teltonika_long_5h.py"
