name: '[DEV] 3_canary_single_5h_deep [5h]'

on:
  schedule:
    # Нічний автозапуск 5-год перевірки для Single (47613) у вікні тиші:
    # 22:10 UTC -> ~03:10 UTC (= 00:10..05:10 Київ взимку / 01:10..06:10 влітку)
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-canary-3-single-5h
  cancel-in-progress: false

jobs:
  run-3-canary-single-5h-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Wait if [DEV] 1_canary_single_2refills_drain is running on 47613
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 workflow_guard.py --target "[DEV] 1_canary_single_2refills_drain.yml" --mode wait --timeout-sec 3000

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run [DEV] 3_canary_single_5h_deep.py
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] 3_canary_single_5h_deep.py"
