name: '[PROD] Teltonika Multievent Regression [5h, 300 BB]'

on:
  schedule:
    # Автозапуск 3 рази на добу кожні 8 год (~5 год прогін + ~3 год пауза):
    # 01:35, 09:35, 17:35 UTC (= 03:35, 11:35, 19:35 Київ взимку)
    - cron: '35 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prod-canary-teltonika-multievent
  cancel-in-progress: false

jobs:
  run-canary-teltonika-double-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Canary Script ([PROD] Teltonika Multievent Regression)
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://my.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[PROD] canary_teltonika_double.py"
