name: '[DEV] 1_canary_single_2refills_drain [43m]'

on:
  schedule:
    # Денний розклад UTC (кожні 3 год вдень, БЕЗ нічного вікна 22:00-05:00 UTC для 5h перевірок):
    # 05:05, 08:05, 11:05, 14:05, 17:05, 20:05 UTC (= 07:05..22:05 Київ взимку / 08:05..23:05 влітку)
    - cron: '5 5,8,11,14,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-canary-1-single
  cancel-in-progress: false

jobs:
  run-1-canary-single-2refills-drain:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Kyiv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Guard against [DEV] 3_canary_single_5h_deep collision on 47613
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 workflow_guard.py --target "[DEV] 3_canary_single_5h_deep.yml" --mode skip --cooldown-min 15

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run [DEV] 1_canary_single_2refills_drain.py
        if: steps.guard.outputs.skip != 'true'
        env:
          M2M_EMAIL: ${{ secrets.M2M_EMAIL }}
          M2M_PASSWORD: ${{ secrets.M2M_PASSWORD }}
          M2M_API_TOKEN: ${{ secrets.M2M_API_TOKEN }}
          M2M_API_BASE_URL: https://dev-stag.m2m.eu/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
        run: python "[DEV] 1_canary_single_2refills_drain.py"
